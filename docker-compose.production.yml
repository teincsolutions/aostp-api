services:
  aostp-api:
    image: ${DOCKER_IMAGE_NAME:-teincsolutions/aostp-api}:${DOCKER_TAG:-latest}
    container_name: aostp-api-production
    restart: always
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    networks:
      - aostp-internal-net
      - aostp-internet
    depends_on:
      - redis
  redis:
    image: redis:latest
    container_name: redis-production
    restart: always
    ports:
      - "6379:6379"
    networks:
      - aostp-internal-net

networks:
  aostp-internal-net:
    external: true
  aostp-internet:
    external: true
