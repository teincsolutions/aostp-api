
services:
  aostp-api:
    image: ${DOCKER_IMAGE_NAME:-teincsolutions/aostp-api}:${DOCKER_TAG:-latest}
    container_name: aostp-api-production
    restart: always
    env_file:
      - .env.production
    ports:
      - "3001:3000"
    networks:
      - aostp-internal-net

networks:
  aostp-internal-net:
    external: true
